name: EduPrime CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-scan:
    name: Python Tests and SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest -v

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=sindhupothuri99
            -Dsonar.projectKey=Sindhupothuri99_student-sindhu
            -Dsonar.projectName="EduPrime Student Management System"
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
