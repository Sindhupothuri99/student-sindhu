apiVersion: v1
kind: PersistentVolume
metadata:
  name: eduprime-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /home/ubuntu/student-sindhu/instance
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eduprime-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
